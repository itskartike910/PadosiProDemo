services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padosipro_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./padosipro.db
      - JWT_SECRET_KEY=supersecretjwtkeyforpadosiproproduction2026
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - OTP_EXPIRE_MINUTES=10
      - OTP_RESEND_COOLDOWN_SECONDS=30
      - OTP_MAX_ATTEMPTS=5
    volumes:
      - ./backend/padosipro.db:/app/padosipro.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
