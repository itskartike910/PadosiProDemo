name: padosi_pro
description: "PadosiPro — Your personal Lifestyle Manager app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.8.0+1

  # ── Code Generation ───────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Secure Storage ────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── OTP Input ─────────────────────────────────────────────────────────────
  pin_code_fields: ^8.0.1

  # ── Fonts ─────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── UI Utilities ──────────────────────────────────────────────────────────
  gap: ^3.0.1
  shimmer: ^3.0.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.20.2
  equatable: ^2.0.7
  logger: ^2.5.0
  shared_preferences: ^2.3.3

  # ── Icons ─────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#112828"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
